<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-item lines="full">
    <ion-input
      placeholder="Nueva categoría..."
      [(ngModel)]="newCategoryName"
      (keyup.enter)="addCategory()">
    </ion-input>
  </ion-item>

  <ion-button expand="block" class="ion-margin-top" (click)="addCategory()">
    Crear categoría
  </ion-button>

  <ion-list class="ion-margin-top">
    <ion-item-sliding *ngFor="let c of (categories$ | async)">
      <ion-item>
        <ion-icon slot="start" name="pricetag" [style.color]="c.color"></ion-icon>
        <ion-label>{{ c.name }}</ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="editCategory(c)">
          Editar
        </ion-item-option>
        <ion-item-option color="danger" (click)="deleteCategory(c)">
          Eliminar
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

</ion-content>
